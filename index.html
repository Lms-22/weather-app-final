<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 날씨 예보</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="weather-app">
        <header>
            <h1>☁️ 날씨 예보</h1>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="도시 이름 검색 (예: 서울, Tokyo)">
                <button id="search-btn">🔍</button>
            </div>
            <button id="current-location-btn">📍 현재 위치로 찾기</button>
        </header>

        <div id="recent-searches"></div>

        <main>
            <div id="error-message" class="error-message"></div>

            <section id="current-weather">
                </section>
            
            <section id="lifestyle-tips" style="background: rgba(255,255,255,0.5); padding: 15px; margin: 20px 0; border-radius: 10px; text-align: center;">
                <h3>💡 오늘의 팁</h3>
                <p id="fashion-advice">데이터 로딩 중...</p>
            </section>

            <section id="charts" style="margin: 20px 0; background: white; padding: 10px; border-radius: 10px;">
                <h3>📉 24시간 기온 변화</h3>
                <canvas id="tempChart"></canvas>
            </section>

            <section id="forecast">
                <h2>5일간의 예보</h2>
                <div id="forecast-cards" class="forecast-cards"></div>
            </section>
        </main>

        <footer>
            <button id="unit-toggle">℃ / ℉</button>
            <select id="lang-select" style="margin-left: 10px; padding: 5px; border-radius: 5px;">
                <option value="kr">🇰🇷 한국어</option>
                <option value="en">🇺🇸 English</option>
                <option value="jp">🇯🇵 日本語</option>
                <option value="cn">🇨🇳 中文 (简体)</option>
            </select>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
